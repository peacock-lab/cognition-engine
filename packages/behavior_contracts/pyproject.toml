[project]
name = "cognition-engine-behavior-contracts"
version = "0.5.0"
description = "Behavior contracts for Cognition Engine."
requires-python = ">=3.14"
dependencies = [
  "cognition-engine-schemas==0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/behavior_contracts"]

[tool.uv.sources]
cognition-engine-schemas = { workspace = true }
