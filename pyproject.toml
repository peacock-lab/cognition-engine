[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

# Root package v0.8.4 release note:
# - This pyproject represents the Cognition System aggregate distribution.
# - The aggregate package depends on the v0.8.4 multi-package baseline under
#   packages/*.
# - The 0.8.4 line is a new PyPI baseline under cognition-system distribution
#   names.
[project]
name = "cognition-system"
version = "0.8.4"
description = "Aggregate metadata package for the Cognition System v0.8.4 baseline."
readme = { text = "Cognition System v0.8.4 public aggregate package. See the version-specific public README in the release repository for usage and boundary notes.", content-type = "text/markdown" }
requires-python = ">=3.14"
dependencies = [
    "cognition-system-schemas==0.8.4",
    "cognition-system-behavior-contracts==0.8.4",
    "cognition-system-config-assembly==0.8.4",
    "cognition-system-config-contexts==0.8.4",
    "cognition-system-runtime==0.8.4",
    "cognition-system-contract-core==0.8.4",
    "cognition-system-adk-adapter==0.8.4",
    "cognition-system-observability-hub==0.8.4",
    "cognition-system-cognition-agent==0.8.4",
    "cognition-system-cognition-governance==0.8.4",
    "cognition-system-evaluation==0.8.4",
    "cognition-system-composition==0.8.4",
    "cognition-system-external-readonly==0.8.4",
    "cognition-system-runtime-container==0.8.4",
    "cognition-system-operation-flows==0.8.4",
    "cognition-system-product-gateway==0.8.4",
    "cognition-system-product-console==0.8.4",
    "cognition-system-product-runtime-assembly==0.8.4",
    "cognition-system-product-application-assembly==0.8.4",
    "cognition-system-cli==0.8.4",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
release = [
    "build>=1.4.4",
    "twine>=6.2.0",
]

test = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
    "factory-boy>=3.3.3",
    "Faker>=40.15.0",
    "freezegun>=1.5.5",
    "hypothesis>=6.152.1",
    "pytest-html>=4.2.0",
    "pytest-json-report>=1.5.0",
]


# The root distribution is an aggregate metadata package. It intentionally has
# no importable root modules; product code is published from packages/*.
[tool.setuptools]
packages = []
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = [".git", ".venv", "venv", "env", "build", "dist", "*.egg-info"]
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
    "slow: 慢速测试（运行时间 > 5秒）",
    "network: 需要网络连接的测试",
    "mock: 使用模拟的测试",
]
addopts = ["-v", "--tb=short", "--strict-markers"]

# Workspace members under packages/* are the v0.8.4 multi-package baseline.
[tool.uv.workspace]
members = [
    "packages/*",
]

[tool.uv.sources]
cognition-system-schemas = { workspace = true }
cognition-system-behavior-contracts = { workspace = true }
cognition-system-config-contexts = { workspace = true }
cognition-system-cognition-agent = { workspace = true }
cognition-system-cognition-governance = { workspace = true }
cognition-system-evaluation = { workspace = true }
cognition-system-config-assembly = { workspace = true }
cognition-system-runtime = { workspace = true }
cognition-system-composition = { workspace = true }
cognition-system-external-readonly = { workspace = true }
cognition-system-contract-core = { workspace = true }
cognition-system-adk-adapter = { workspace = true }
cognition-system-observability-hub = { workspace = true }
cognition-system-runtime-container = { workspace = true }
cognition-system-operation-flows = { workspace = true }
cognition-system-cli = { workspace = true }
cognition-system-product-gateway = { workspace = true }
cognition-system-product-console = { workspace = true }
cognition-system-product-runtime-assembly = { workspace = true }
cognition-system-product-application-assembly = { workspace = true }

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
]
