[project]
name = "cognition-system-cli"
version = "0.7.0"
readme = { text = "Cognition System v0.7.0 public CLI package. See the version-specific public README in the release repository for usage and boundary notes.", content-type = "text/markdown" }
description = "Candidate CLI entry package for the Cognition System."
requires-python = ">=3.14"
dependencies = [
  "cognition-system-runtime-container==0.7.0",
]

[project.scripts]
cognition = "cognition_cli.entrypoints.cognition:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cognition_cli"]

[tool.uv.sources]
cognition-system-runtime-container = { workspace = true }
