[project]
name = "cognition-system-config-assembly"
version = "0.7.0"
readme = { text = "Cognition System v0.7.0 public configuration assembly package. See the version-specific public README in the release repository for usage and boundary notes.", content-type = "text/markdown" }
description = "Configuration assembly package for Cognition System."
requires-python = ">=3.14"
dependencies = [
  "pyyaml>=6.0.3",
  "pydantic>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/config_assembly"]
