[project]
name = "cognition-engine-config-assembly"
version = "0.5.2"
readme = "README.md"
description = "Configuration assembly package for Cognition Engine."
requires-python = ">=3.14"
dependencies = [
  "pyyaml>=6.0.3",
  "pydantic>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/config_assembly"]
