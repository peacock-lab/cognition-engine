[project]
name = "cognition-engine-composition"
version = "0.5.0"
description = "Composition root package for Cognition Engine."
requires-python = ">=3.14"
dependencies = [
  "cognition-engine-behavior-contracts==0.5.0",
  "cognition-engine-schemas==0.5.0",
  "cognition-engine-config-assembly==0.5.0",
  "cognition-engine-config-contexts==0.5.0",
  "cognition-engine-runtime==0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/composition"]

[tool.uv.sources]
cognition-engine-behavior-contracts = { workspace = true }
cognition-engine-schemas = { workspace = true }
cognition-engine-config-assembly = { workspace = true }
cognition-engine-config-contexts = { workspace = true }
cognition-engine-runtime = { workspace = true }
