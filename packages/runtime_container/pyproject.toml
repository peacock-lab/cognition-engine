[project]
name = "cognition-system-runtime-container"
version = "0.7.0"
readme = { text = "Cognition System v0.7.0 public runtime container package. See the version-specific public README in the release repository for usage and boundary notes.", content-type = "text/markdown" }
description = "Thin runtime-container facade package for Cognition System."
requires-python = ">=3.14"
dependencies = [
  "cognition-system-runtime==0.7.0",
  "cognition-system-composition==0.7.0",
  "cognition-system-contract-core==0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runtime_container"]

[tool.uv.sources]
cognition-system-runtime = { workspace = true }
cognition-system-composition = { workspace = true }
cognition-system-contract-core = { workspace = true }
