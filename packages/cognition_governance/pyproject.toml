[project]
name = "cognition-system-cognition-governance"
version = "0.8.4"
description = "Cognition governance internal models for cognition-system."
readme = { text = "Cognition System v0.8.4 public package. See the version-specific public README in the release repository for usage and boundary notes.", content-type = "text/markdown" }
requires-python = ">=3.14"
dependencies = [
    "cognition-system-schemas==0.8.4",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cognition_governance"]

[tool.uv.sources]
cognition-system-schemas = { workspace = true }
