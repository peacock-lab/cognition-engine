[project]
name = "cognition-system-schemas"
version = "0.7.0"
readme = { text = "Cognition System v0.7.0 public package. See the version-specific public README in the release repository for usage and boundary notes.", content-type = "text/markdown" }
description = "Public data schemas for Cognition System."
requires-python = ">=3.14"
dependencies = [
  "pydantic>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schemas"]
