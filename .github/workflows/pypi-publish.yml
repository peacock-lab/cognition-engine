name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build or publish"
        required: true
        type: string
      previous_version:
        description: "Previous public version"
        required: true
        type: string
      publish:
        description: "Publish to PyPI after build and install-state smoke"
        required: true
        default: false
        type: boolean
      force_node24:
        description: "Force JavaScript actions to run on Node24 for readiness verification"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: ${{ inputs.force_node24 && 'true' || '' }}

jobs:
  precheck:
    name: Precheck
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check public release surface
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"
          PREVIOUS_VERSION="${{ inputs.previous_version }}"
          PUBLISH="${{ inputs.publish }}"
          EXPECTED_REF="refs/tags/v${VERSION}"

          if [ "$PUBLISH" = "true" ]; then
            if [ "$GITHUB_REF" != "$EXPECTED_REF" ]; then
              echo "publish=true requires ref $EXPECTED_REF, got $GITHUB_REF"
              exit 1
            fi
          else
            echo "non-publish verification: build and install-state smoke only"
          fi

          python - <<'PY'
          from pathlib import Path
          import re
          import sys
          import tomllib

          version = "${{ inputs.version }}"
          previous_version = "${{ inputs.previous_version }}"
          package_roots = sorted(Path("packages").glob("*/pyproject.toml"))
          pyprojects = [Path("pyproject.toml"), *package_roots]

          ok = True

          for file in pyprojects:
              data = tomllib.loads(file.read_text(encoding="utf-8"))
              actual = data.get("project", {}).get("version")
              print(f"{file}: {actual}")
              if actual != version:
                  print(f"{file}: expected {version}, got {actual}")
                  ok = False

              if file == Path("pyproject.toml"):
                  for dependency in data.get("project", {}).get("dependencies", []):
                      if dependency.startswith("cognition-system-") and not dependency.endswith(f"=={version}"):
                          print(f"{file}: internal dependency mismatch: {dependency}")
                          ok = False

          for public_file in [
              Path("README.md"),
              Path("README.zh-CN.md"),
              Path("QUICKSTART.md"),
              Path("QUICKSTART.zh-CN.md"),
              Path("CHANGELOG.md"),
          ]:
              text = public_file.read_text(encoding="utf-8")
              if version not in text:
                  print(f"{public_file}: missing target version {version}")
                  ok = False
              current_previous = re.compile(
                  rf"(current|当前发布候选版本|Current release candidate).*{re.escape(previous_version)}",
                  re.IGNORECASE,
              )
              if current_previous.search(text):
                  print(f"{public_file}: previous version still appears as current")
                  ok = False

          forbidden_prefixes = ("config/", "docs/", "tasks/", "patches/", "scripts/")
          forbidden_suffixes = ("/README.md",)
          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              rel = path.as_posix()
              if rel.startswith((".git/", ".venv/", "dist/", "build/", "wheelhouse/")):
                  continue
              if rel == ".gitignore" or rel.startswith(forbidden_prefixes):
                  print(f"forbidden public path: {rel}")
                  ok = False
              if rel.startswith("packages/") and rel.endswith(forbidden_suffixes):
                  print(f"package README must not be public by default: {rel}")
                  ok = False
              if rel.endswith((".pyc", ".pyo")) or "__pycache__" in rel:
                  print(f"build artifact found: {rel}")
                  ok = False

          if not ok:
              sys.exit(1)
          PY

  build:
    name: Build distributions
    needs: precheck
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      wheelhouse-digest: ${{ steps.upload-wheelhouse.outputs.artifact-digest }}
      wheelhouse-id: ${{ steps.upload-wheelhouse.outputs.artifact-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build root package
        run: |
          rm -rf wheelhouse dist build *.egg-info
          python -m build
          mkdir -p wheelhouse
          cp dist/* wheelhouse/

      - name: Build subpackages
        shell: bash
        run: |
          set -euo pipefail

          for package_dir in packages/*; do
            if [ -f "$package_dir/pyproject.toml" ]; then
              echo "Building $package_dir"
              (
                cd "$package_dir"
                rm -rf dist build *.egg-info
                python -m build
                cp dist/* "$GITHUB_WORKSPACE/wheelhouse/"
              )
            fi
          done

      - name: Check distributions
        run: |
          python -m twine check wheelhouse/*

      - name: Upload distributions artifact
        id: upload-wheelhouse
        uses: actions/upload-artifact@v7
        with:
          name: wheelhouse
          path: wheelhouse/

      - name: Summarize wheelhouse artifact
        run: |
          {
            echo "### Wheelhouse artifact"
            echo "- artifact_id: ${{ steps.upload-wheelhouse.outputs.artifact-id }}"
            echo "- artifact_digest: ${{ steps.upload-wheelhouse.outputs.artifact-digest }}"
          } >> "$GITHUB_STEP_SUMMARY"

  install-state-smoke:
    name: Install-state smoke
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Download distributions artifact
        uses: actions/download-artifact@v7
        with:
          name: wheelhouse
          path: wheelhouse/

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Verify install-state from wheelhouse
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"
          WORKDIR="$(mktemp -d)"
          python -m venv "$WORKDIR/.venv"
          "$WORKDIR/.venv/bin/python" -m pip install --upgrade pip
          "$WORKDIR/.venv/bin/python" -m pip install --find-links "$GITHUB_WORKSPACE/wheelhouse" "cognition-system==$VERSION"

          cd "$WORKDIR"
          .venv/bin/cognition-console --help
          .venv/bin/cognition --help

          .venv/bin/python - <<'PY'
          from pathlib import Path

          assert not Path("config/base/runtime.yaml").exists()

          from config_assembly.runtime import assemble_packaged_default_runtime_config_payload
          payload = assemble_packaged_default_runtime_config_payload()
          assert payload.source_root == "package://config_assembly/default_config"
          assert payload.payload["live_llm"]["model_aliases"]["gemma4"]["model_name"] == "ollama/gemma4-pro:latest"

          from composition.llm_invocation_assembly import (
              build_controlled_live_adk_governed_llm_invocation_service_from_config_root,
          )
          service = build_controlled_live_adk_governed_llm_invocation_service_from_config_root(
              model_profile_ref="gemma4_pro_local",
              output_governance_profile_ref="adk_output_schema_gemma4_baseline",
          )
          assert service is not None

          from types import SimpleNamespace
          from product_console import run_product_console

          output = []

          def reader(_prompt: str) -> str:
              raise KeyboardInterrupt

          code = run_product_console(
              ["ask", "--guided"],
              input_reader=reader,
              output_writer=output.append,
              ask_runner=lambda _request: SimpleNamespace(exit_code=0, output={"status": "success"}),
          )
          joined = "\n".join(output)
          assert code == 130
          assert "status: interrupted" in joined
          assert "Traceback" not in joined

          print("install-state-smoke: PASS")
          PY

      - name: Summarize install-state smoke
        run: |
          {
            echo "### Install-state smoke"
            echo "- version: ${{ inputs.version }}"
            echo "- wheelhouse_artifact_id: ${{ needs.build.outputs.wheelhouse-id }}"
            echo "- wheelhouse_artifact_digest: ${{ needs.build.outputs.wheelhouse-digest }}"
            echo "- publish_requested: ${{ inputs.publish }}"
          } >> "$GITHUB_STEP_SUMMARY"

  non-publish-summary:
    name: Non-publish verification summary
    needs: install-state-smoke
    if: ${{ inputs.publish != true }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Confirm no publish requested
        run: |
          {
            echo "### Non-publish verification complete"
            echo "- version: ${{ inputs.version }}"
            echo "- ref: ${{ github.ref }}"
            echo "- publish_requested: ${{ inputs.publish }}"
            echo "- pypi_upload: skipped"
            echo "- pypi_environment: not requested"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to PyPI
    needs: install-state-smoke
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions artifact
        uses: actions/download-artifact@v7
        with:
          name: wheelhouse
          path: wheelhouse/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse/

  postverify:
    name: Verify published package
    needs: publish
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Verify install from PyPI
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cognition-system==${{ inputs.version }}"
          python - <<'PY'
          import importlib.metadata as metadata

          expected = "${{ inputs.version }}"
          actual = metadata.version("cognition-system")
          print(f"cognition-system {actual} installed")
          if actual != expected:
              raise SystemExit(f"expected {expected}, got {actual}")
          PY
          cognition-console --help
          cognition --help
