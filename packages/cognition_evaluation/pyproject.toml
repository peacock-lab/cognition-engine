[project]
name = "cognition-system-evaluation"
version = "0.8.1"
readme = { text = "Cognition System evaluation public package candidate. See the version-specific public README in the release repository for usage and boundary notes.", content-type = "text/markdown" }
description = "Evaluation contracts and helpers for Cognition System."
requires-python = ">=3.14"
dependencies = [
  "pydantic>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cognition_evaluation"]

[tool.cognition_evaluation]
status = "product_level_evaluation"
package = "cognition_evaluation"
source_root = "src/cognition_evaluation"
adk_native_evaluation_capability_enabled = true
architecture_boundary_evaluation_enabled = true
contract_boundary_evaluation_enabled = true
configuration_boundary_evaluation_enabled = true
adk_raw_object_export_enabled = false
runtime_execution_enabled = false
governance_decision_enabled = false
observability_persistence_enabled = false
product_gateway_entry_enabled = false
publishable = true
release_configured = true
