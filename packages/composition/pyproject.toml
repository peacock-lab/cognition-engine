[project]
name = "cognition-system-composition"
version = "0.8.3"
readme = { text = "Cognition System v0.8.3 public package. See the version-specific public README in the release repository for usage and boundary notes.", content-type = "text/markdown" }
description = "Composition root package for Cognition System."
requires-python = ">=3.14"
dependencies = [
  "cognition-system-adk-adapter==0.8.3",
  "cognition-system-behavior-contracts==0.8.3",
  "cognition-system-contract-core==0.8.3",
  "cognition-system-schemas==0.8.3",
  "cognition-system-config-assembly==0.8.3",
  "cognition-system-config-contexts==0.8.3",
  "cognition-system-cognition-agent==0.8.3",
  "cognition-system-observability-hub==0.8.3",
  "cognition-system-runtime==0.8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/composition"]

[tool.uv.sources]
cognition-system-adk-adapter = { workspace = true }
cognition-system-behavior-contracts = { workspace = true }
cognition-system-contract-core = { workspace = true }
cognition-system-schemas = { workspace = true }
cognition-system-config-assembly = { workspace = true }
cognition-system-config-contexts = { workspace = true }
cognition-system-cognition-agent = { workspace = true }
cognition-system-observability-hub = { workspace = true }
cognition-system-runtime = { workspace = true }
