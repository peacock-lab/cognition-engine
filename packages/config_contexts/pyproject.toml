[project]
name = "cognition-engine-config-contexts"
version = "0.5.3"
readme = "README.md"
description = "Configuration contexts and Config Views for Cognition Engine."
requires-python = ">=3.14"
dependencies = [
  "pydantic>=2.13.0",
  "cognition-engine-schemas==0.5.3",
  "cognition-engine-config-assembly==0.5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/config_contexts"]

[tool.uv.sources]
cognition-engine-schemas = { workspace = true }
cognition-engine-config-assembly = { workspace = true }
