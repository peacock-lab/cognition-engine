[project]
name = "cognition-engine-schemas"
version = "0.5.2"
readme = "README.md"
description = "Public data schemas for Cognition Engine."
requires-python = ">=3.14"
dependencies = [
  "pydantic>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schemas"]
