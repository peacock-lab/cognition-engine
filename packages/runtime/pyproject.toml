[project]
name = "cognition-engine-runtime"
version = "0.5.3"
readme = "README.md"
description = "Runtime orchestration package for Cognition Engine."
requires-python = ">=3.14"
dependencies = [
  "cognition-engine-behavior-contracts==0.5.3",
  "cognition-engine-schemas==0.5.3",
  "cognition-engine-config-contexts==0.5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runtime"]

[tool.uv.sources]
cognition-engine-behavior-contracts = { workspace = true }
cognition-engine-schemas = { workspace = true }
cognition-engine-config-contexts = { workspace = true }
