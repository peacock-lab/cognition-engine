[project]
name = "cognition-engine-runtime-container"
version = "0.5.0"
description = "Thin runtime-container facade package for Cognition Engine."
requires-python = ">=3.14"
dependencies = [
  "cognition-engine-runtime==0.5.0",
  "cognition-engine-composition==0.5.0",
  "cognition-engine-contract-core==0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runtime_container"]

[tool.uv.sources]
cognition-engine-runtime = { workspace = true }
cognition-engine-composition = { workspace = true }
cognition-engine-contract-core = { workspace = true }
