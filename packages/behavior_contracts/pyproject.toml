[project]
name = "cognition-system-behavior-contracts"
version = "0.8.1"
readme = { text = "Cognition System v0.8.1 public package. See the version-specific public README in the release repository for usage and boundary notes.", content-type = "text/markdown" }
description = "Behavior contracts for Cognition System."
requires-python = ">=3.14"
dependencies = [
  "cognition-system-config-contexts==0.8.1",
  "cognition-system-evaluation==0.8.1",
  "cognition-system-schemas==0.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/behavior_contracts"]

[tool.uv.sources]
cognition-system-config-contexts = { workspace = true }
cognition-system-evaluation = { workspace = true }
cognition-system-schemas = { workspace = true }
