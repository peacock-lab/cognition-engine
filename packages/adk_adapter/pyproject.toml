[project]
name = "cognition-system-adk-adapter"
version = "0.8.0"
readme = { text = "Cognition System v0.8.0 public package. See the version-specific public README in the release repository for usage and boundary notes.", content-type = "text/markdown" }
description = "Google ADK adapter implementations for Cognition System contracts."
requires-python = ">=3.14"
dependencies = [
  "cognition-system-behavior-contracts==0.8.0",
  "cognition-system-schemas==0.8.0",
  "cognition-system-config-contexts==0.8.0",
  "google-adk==2.0.0",
  "litellm==1.82.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adk_adapter"]

[tool.uv.sources]
cognition-system-behavior-contracts = { workspace = true }
cognition-system-schemas = { workspace = true }
cognition-system-config-contexts = { workspace = true }
