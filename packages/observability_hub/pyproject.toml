[project]
name = "cognition-system-observability-hub"
version = "0.8.1"
readme = { text = "Cognition System v0.8.1 public package. See the version-specific public README in the release repository for usage and boundary notes.", content-type = "text/markdown" }
description = "Lowest observability-hub intake package for Cognition System."
requires-python = ">=3.14"
dependencies = [
  "pydantic>=2.13.0",
  "cognition-system-schemas==0.8.1",
  "cognition-system-contract-core==0.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observability_hub"]

[tool.uv.sources]
cognition-system-schemas = { workspace = true }
cognition-system-contract-core = { workspace = true }
