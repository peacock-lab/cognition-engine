runtime:
  runtime_name: default-runtime
  execution_mode: local
  default_workflow_name: insight-to-decision
  enable_event_capture: true
  enable_state_delta_capture: true
  enable_artifact_delta_capture: true
  default_adapter: local
  timeout_seconds: 300
  retry_policy_ref: default-runtime-retry

workflow_execution:
  workflow_name: insight-to-decision
  graph_mode: true
  allow_dynamic_nodes: true
  allow_collaborative_agents: false
  max_node_count: 100
  max_execution_depth: 20
  timeout_seconds: 300

node_execution:
  node_execution_mode: isolated
  enable_node_isolation: true
  timeout_seconds: 120
  max_retries: 0
  allow_parallel_execution: false

resume_policy:
  enable_resume: true
  enable_hitl: false
  resume_storage_policy: local
  resume_token_ttl_seconds: 3600
  require_human_confirmation: false

event_policy:
  enable_event_stream: true
  capture_node_events: true
  capture_state_deltas: true
  capture_artifact_deltas: true
  event_sink_name: local

artifact_policy:
  enable_artifact_capture: true
  artifact_sink_name: local
  artifact_name_prefix: ce-runtime
  artifact_version_policy: timestamp

adapter_selection:
  default_runtime_adapter: local
  adk_adapter_enabled: false
  litellm_adapter_enabled: false
  hermes_adapter_enabled: false
  openclaw_adapter_enabled: false
  fallback_adapter: local

live_llm:
  profile: adk_litellm_ollama
  model_name: ollama/gemma4-pro:latest
  ollama_api_base: http://127.0.0.1:11434
  timeout_seconds: 45
  temperature: 0
  max_tokens: 64
  enabled_by_default: false
  default_provider_profile_ref: local_ollama
  provider_profiles:
    local_ollama:
      provider: litellm
      backend_provider: ollama
      route_kind: adk_litellm
      api_base: http://127.0.0.1:11434
      network_access: local_only
      requires_network_gate: false
      requires_operator_approval: false
      requires_audit_ref: false
      enabled_by_default: false
      metadata:
        source: config_assembly/default_config/base/runtime.yaml
        default_equivalent: true
    deepseek_gated:
      provider: litellm
      backend_provider: deepseek
      route_kind: adk_litellm_openai_compatible
      api_base: https://api.deepseek.com
      api_base_env_var: DEEPSEEK_API_BASE
      secret_ref: secret-ref://env/DEEPSEEK_API_KEY
      network_access: external_gated
      requires_network_gate: true
      requires_operator_approval: true
      requires_audit_ref: true
      enabled_by_default: false
      metadata:
        source: config_assembly/default_config/base/runtime.yaml
        candidate_only: true
        product_optional_provider: true
  default_model_profile_ref: gemma4_pro_local
  model_profiles:
    gemma4_pro_local:
      provider_profile_ref: local_ollama
      model_name: ollama/gemma4-pro:latest
      model_role: local_debug_baseline
      timeout_seconds: 45
      temperature: 0
      max_tokens: 256
      resource_tier: local_debug
      enabled_by_default: false
      metadata:
        source: config_assembly/default_config/base/runtime.yaml
        default_equivalent: true
    deepseek_v4_flash_external:
      provider_profile_ref: deepseek_gated
      model_name: deepseek/deepseek-v4-flash
      model_role: external_low_hardware_candidate
      timeout_seconds: 180
      temperature: 0
      max_tokens: 256
      resource_tier: external_managed
      enabled_by_default: false
      metadata:
        source: config_assembly/default_config/base/runtime.yaml
        candidate_only: true
        model_family: deepseek_v4
        model_release: v4
        thinking_mode: disabled
    deepseek_v4_pro_external:
      provider_profile_ref: deepseek_gated
      model_name: deepseek/deepseek-v4-pro
      model_role: external_high_quality_candidate
      timeout_seconds: 180
      temperature: 0
      max_tokens: 256
      resource_tier: external_managed
      enabled_by_default: false
      metadata:
        source: config_assembly/default_config/base/runtime.yaml
        candidate_only: true
        model_family: deepseek_v4
        model_release: v4
        thinking_mode: disabled
  default_output_governance_profile_ref: direct_controlled_live
  output_governance_profiles:
    direct_controlled_live:
      mode: direct_controlled_live
      adk_native: false
      uses_output_schema: false
      uses_output_key: false
      uses_after_model_callback: false
      uses_answer_quality_guard: true
      max_repair_attempts: 0
      enabled_by_default: false
      metadata:
        source: config_assembly/default_config/base/runtime.yaml
        default_equivalent: true
    adk_output_schema_gemma4_baseline:
      mode: adk_output_schema
      adk_native: true
      uses_output_schema: true
      uses_output_key: true
      uses_after_model_callback: true
      uses_answer_quality_guard: true
      max_repair_attempts: 1
      enabled_by_default: false
      metadata:
        source: config_assembly/default_config/base/runtime.yaml
        profile_gated: true
        local_gemma4_baseline: true
    adk_no_output_schema_candidate:
      mode: adk_no_output_schema
      adk_native: true
      uses_output_schema: false
      uses_output_key: false
      uses_after_model_callback: true
      uses_answer_quality_guard: true
      max_repair_attempts: 1
      enabled_by_default: false
      metadata:
        source: config_assembly/default_config/base/runtime.yaml
        candidate_only: true
  model_aliases:
    gemma4:
      provider_profile_ref: local_ollama
      model_profile_ref: gemma4_pro_local
      output_governance_profile_ref: adk_output_schema_gemma4_baseline
      model_name: ollama/gemma4-pro:latest
      enabled_by_default: false
      metadata:
        source: config_assembly/default_config/base/runtime.yaml
        user_facing: true
        adk_native_output_governance: true
    deepseek:
      provider_profile_ref: deepseek_gated
      model_profile_ref: deepseek_v4_flash_external
      output_governance_profile_ref: adk_no_output_schema_candidate
      model_name: deepseek/deepseek-v4-flash
      enabled_by_default: false
      metadata:
        source: config_assembly/default_config/base/runtime.yaml
        user_facing: true
        product_optional_provider: true
        thinking_mode: disabled

tool_confirmation:
  default_require_confirmation: true
  default_mode: operator_required
  controlled_live_external_tool_smoke_enabled: false
  auto_confirmation_allowed: false
  low_risk_tool_allowlist:
    - deterministic_external_echo
  metadata:
    source: config/base/runtime.yaml
    adk_feature_status: experimental

tool_exposure:
  default_profile: readonly_reference
  profiles:
    readonly_reference:
      source_ref: config://base/runtime/tool_exposure/readonly_reference
      toolsets:
        - toolset_name: local_reference_tools
          toolset_kind: toolset
          source_ref: local-reference-reader://workspace
          allowlist_tool_names:
            - local_reference_reader
          tool_filter:
            - local_reference_reader
          readonly_only: true
          max_risk_level: low
          dynamic_toolset: true
          discovery_credential_ref: credential://not-required
          execution_credential_ref: credential://not-required
          reference_reader:
            enabled: true
            allowed_roots:
              - tasks
              - docs
            allowed_files:
              - pyproject.toml
            allowed_suffixes:
              - .md
              - .txt
              - .json
              - .yaml
              - .yml
              - .toml
            max_bytes: 32768
            max_chars: 6000
            max_excerpt_lines: 80
  metadata:
    source: config/base/runtime.yaml
    candidate_only: true

run_workspace:
  enabled_by_default: false
  workspace_root: .cognition-runs
  retention_policy: keep
  cleanup_policy: manual
  max_write_bytes: 65536
  metadata:
    source: config/base/runtime.yaml
    candidate_only: true

evidence_summary_answer:
  enabled_by_default: false
  profile: smoke_only
  exposure_enabled: true
  allow_model_context: true
  allow_governed_summary_facts: true
  allow_raw_boundary: false
  allow_sanitized_excerpt_preview: false
  allow_observability_candidate_body: false
  citation_required: true
  allow_citation_exception: false
  insufficient_evidence_required: true
  max_summary_facts: 24
  max_summary_fact_chars: 500
  max_total_summary_fact_chars: 4000
  model_context_budget: 4000
  answer_preview_limit: 1000
  metadata:
    source: config/base/runtime.yaml
    candidate_only: true
