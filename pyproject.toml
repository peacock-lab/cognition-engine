[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

# Root package v0.5.0 release note:
# - This pyproject now represents the v0.5.0 aggregate distribution package.
# - The aggregate package depends on the v0.5.0 multi-package baseline under
#   packages/* and no longer publishes the legacy cognition_engine/ shell.
# - The legacy cognition_engine/ source tree may remain in the repository as
#   historical material, but it is not part of the v0.5.0 formal release face.
[project]
name = "cognition-engine"
version = "0.5.2"
description = "Aggregate distribution package for the Cognition Engine v0.5.0 multi-package baseline."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cognition-engine-schemas==0.5.2",
    "cognition-engine-behavior-contracts==0.5.2",
    "cognition-engine-config-contexts==0.5.2",
    "cognition-engine-config-assembly==0.5.2",
    "cognition-engine-runtime==0.5.2",
    "cognition-engine-composition==0.5.2",
    "cognition-engine-contract-core==0.5.2",
    "cognition-engine-adk-adapter==0.5.2",
    "cognition-engine-observability-hub==0.5.2",
    "cognition-engine-runtime-container==0.5.2",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
release = [
    "build>=1.4.4",
    "twine>=6.2.0",
]

test = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
    "factory-boy>=3.3.3",
    "Faker>=40.15.0",
    "freezegun>=1.5.5",
    "hypothesis>=6.152.1",
    "pytest-html>=4.2.0",
    "pytest-json-report>=1.5.0",
]


# The root distribution is an aggregate metadata package. It intentionally does
# not include the legacy cognition_engine/ source tree in the v0.5.0 release.
[tool.setuptools]
packages = []
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = [".git", ".venv", "venv", "env", "build", "dist", "*.egg-info"]
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
    "slow: 慢速测试（运行时间 > 5秒）",
    "network: 需要网络连接的测试",
    "mock: 使用模拟的测试",
]
addopts = ["-v", "--tb=short", "--strict-markers"]

# Workspace members under packages/* are the v0.5.0 multi-package baseline.
[tool.uv.workspace]
members = [
    "packages/*",
]

[tool.uv.sources]
cognition-engine-schemas = { workspace = true }
cognition-engine-behavior-contracts = { workspace = true }
cognition-engine-config-contexts = { workspace = true }
cognition-engine-config-assembly = { workspace = true }
cognition-engine-runtime = { workspace = true }
cognition-engine-composition = { workspace = true }
cognition-engine-contract-core = { workspace = true }
cognition-engine-adk-adapter = { workspace = true }
cognition-engine-observability-hub = { workspace = true }
cognition-engine-runtime-container = { workspace = true }

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
]
