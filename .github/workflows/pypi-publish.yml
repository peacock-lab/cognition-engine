name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish"
        required: true
        type: string

permissions:
  contents: read

jobs:
  precheck:
    name: Precheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check version consistency
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"

          if [ -z "$VERSION" ]; then
            echo "version input is required"
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          expected = "${{ inputs.version }}"
          files = [Path("pyproject.toml")] + sorted(Path("packages").glob("*/pyproject.toml"))

          ok = True
          for file in files:
              text = file.read_text(encoding="utf-8")
              match = re.search(r'^version = "([^"]+)"', text, re.MULTILINE)
              if not match:
                  print(f"{file}: missing version")
                  ok = False
                  continue

              actual = match.group(1)
              print(f"{file}: {actual}")
              if actual != expected:
                  print(f"{file}: expected {expected}, got {actual}")
                  ok = False

          if not ok:
              sys.exit(1)
          PY

  build:
    name: Build distributions
    needs: precheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build root package
        run: |
          rm -rf wheelhouse dist build *.egg-info
          python -m build
          mkdir -p wheelhouse
          cp dist/* wheelhouse/

      - name: Build subpackages
        shell: bash
        run: |
          set -euo pipefail

          for package_dir in packages/*; do
            if [ -f "$package_dir/pyproject.toml" ]; then
              echo "Building $package_dir"
              (
                cd "$package_dir"
                rm -rf dist build *.egg-info
                python -m build
                cp dist/* "$GITHUB_WORKSPACE/wheelhouse/"
              )
            fi
          done

      - name: Check distributions
        run: |
          python -m twine check wheelhouse/*

      - name: List distributions
        run: |
          ls -la wheelhouse

      - name: Upload distributions artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheelhouse
          path: wheelhouse/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions artifact
        uses: actions/download-artifact@v4
        with:
          name: wheelhouse
          path: wheelhouse/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse/

  postverify:
    name: Verify published package
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cognition-system==${{ inputs.version }}"
          python - <<'PY'
          import importlib.metadata as metadata

          expected = "${{ inputs.version }}"
          actual = metadata.version("cognition-system")
          print(f"cognition-system {actual} installed")
          if actual != expected:
              raise SystemExit(f"expected {expected}, got {actual}")
          PY
          cognition --help
