[project]
name = "cognition-system-cognition-agent"
version = "0.8.0"
description = "Candidate cognition agent package for read-only governance summary consumption."
readme = { text = "Cognition System v0.8.0 public package. See the version-specific public README in the release repository for usage and boundary notes.", content-type = "text/markdown" }
requires-python = ">=3.14"
dependencies = [
  "cognition-system-contract-core==0.8.0",
  "cognition-system-schemas==0.8.0",
  "pydantic>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cognition_agent"]

[tool.uv.sources]
cognition-system-contract-core = { workspace = true }
cognition-system-schemas = { workspace = true }

[tool.cognition_agent]
status = "candidate_only"
package = "cognition_agent"
source_root = "src/cognition_agent"
public_candidate_contract = "contract_core.governance_candidate"
workspace_member = true
publishable = true
release_configured = true
