[project]
name = "cognition-system-product-console"
version = "0.8.2"
description = "Product console channel package for Cognition System."
readme = { text = "Cognition System v0.8.2 public product console package. See the version-specific public README in the release repository for usage and boundary notes.", content-type = "text/markdown" }
requires-python = ">=3.14"
dependencies = [
  "cognition-system-product-application-assembly==0.8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/product_console"]

[tool.uv.sources]
cognition-system-product-application-assembly = { workspace = true }
