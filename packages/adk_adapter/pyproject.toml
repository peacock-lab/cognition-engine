[project]
name = "cognition-engine-adk-adapter"
version = "0.5.4"
readme = "README.md"
description = "Google ADK adapter implementations for Cognition Engine contracts."
requires-python = ">=3.14"
dependencies = [
  "cognition-engine-behavior-contracts==0.5.4",
  "cognition-engine-schemas==0.5.4",
  "cognition-engine-config-contexts==0.5.4",
  "google-adk>=2.0.0b1,<2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adk_adapter"]

[tool.uv.sources]
cognition-engine-behavior-contracts = { workspace = true }
cognition-engine-schemas = { workspace = true }
cognition-engine-config-contexts = { workspace = true }
